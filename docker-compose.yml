services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona
      POSTGRES_DB: persona_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d persona_studio"]
      interval: 2s
      timeout: 3s
      retries: 20

  model:
    build: ./model-service
    environment:
      # "mock" runs without an API key. Set to "openai" and fill in the LLM_* values to use a real model.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://persona:persona@db:5432/persona_studio
      MODEL_SERVICE_URL: http://model:8000
    depends_on:
      db:
        condition: service_healthy
      model:
        condition: service_started
    ports:
      - "4000:4000"

  web:
    build: ./web
    environment:
      API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
